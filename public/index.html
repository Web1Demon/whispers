<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper — Anonymous Messaging & Threaded Discussions</title>
  <meta name="description" content="High-performance anonymous messaging platform built on clean PHP 8.5 architecture, MySQL 8, and DDD principles.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'%3E%3Cpath d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo" onclick="backToFeed()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Whisper</span>
      </div>

      <div class="nav-actions">
        <!-- Anonymous Identity Badge -->
        <div class="identity-chip" title="Your Anonymous Identity">
          <span class="avatar-circle" id="user-avatar" style="background: linear-gradient(135deg, #6366f1, #a855f7)"></span>
          <span id="user-pseudonym">Connecting...</span>
          <button class="btn-icon" onclick="refreshIdentity()" title="Generate New Pseudonym">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>

        <button class="btn btn-secondary btn-sm" onclick="openStatsModal()" title="View System & Architecture Metrics">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          Stats
        </button>

        <a href="/docs" target="_blank" class="btn btn-secondary btn-sm" title="Interactive Swagger / OpenAPI 3.0 Documentation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          API Docs
        </a>

        <button class="btn btn-primary btn-sm" onclick="openModal('modal-new-post')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Whisper
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- FEED VIEW -->
    <section id="feed-view">
      <!-- Search, Filter & Sort Controls -->
      <div class="controls-bar">
        <div class="controls-row">
          <div class="sort-tabs">
            <button class="pill active" data-sort="recent">Recent</button>
            <button class="pill" data-sort="hot">Hot</button>
            <button class="pill" data-sort="popular">Top</button>
            <button class="pill" data-sort="discussed">Discussed</button>
          </div>

          <div class="search-box">
            <span class="search-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: block;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="search-input" class="search-input" placeholder="Search whispers...">
          </div>
        </div>

        <div class="controls-row">
          <div class="category-pills">
            <button class="pill active" data-category="all">All</button>
            <button class="pill" data-category="tech">#tech</button>
            <button class="pill" data-category="confessions">#confessions</button>
            <button class="pill" data-category="deep-thoughts">#deep-thoughts</button>
            <button class="pill" data-category="humor">#humor</button>
            <button class="pill" data-category="life">#life</button>
          </div>
        </div>
      </div>

      <!-- Posts List -->
      <div class="posts-list" id="posts-container">
        <div class="empty-state">Loading whispers...</div>
      </div>
    </section>

    <!-- POST DETAIL & NESTED COMMENTS VIEW -->
    <section id="detail-view" style="display: none;">
      <div class="detail-view" id="post-detail-container">
        <!-- Injected dynamically via app.js -->
      </div>
    </section>

  </main>

  <!-- MODAL: Create New Whisper -->
  <div class="modal-backdrop" id="modal-new-post" style="display: none;" onclick="if(event.target === this) closeModal('modal-new-post')">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Share an Anonymous Whisper</h3>
        <button class="btn-icon" onclick="closeModal('modal-new-post')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="new-post-category" class="form-control">
          <option value="general">#general</option>
          <option value="tech">#tech</option>
          <option value="confessions">#confessions</option>
          <option value="deep-thoughts">#deep-thoughts</option>
          <option value="humor">#humor</option>
          <option value="life">#life</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Title / Headline</label>
        <input type="text" id="new-post-title" class="form-control" placeholder="What's on your mind?" maxlength="120">
      </div>

      <div class="form-group">
        <label class="form-label">Content</label>
        <textarea id="new-post-content" class="form-control" rows="5" placeholder="Write your anonymous story, thoughts, or question..." maxlength="3000"></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem;">
        <button class="btn btn-secondary" onclick="closeModal('modal-new-post')">Cancel</button>
        <button class="btn btn-primary" onclick="createPost()">Publish Whisper</button>
      </div>
    </div>
  </div>

  <!-- MODAL: System & Architecture Stats -->
  <div class="modal-backdrop" id="modal-stats" style="display: none;" onclick="if(event.target === this) closeModal('modal-stats')">
    <div class="modal-content">
      <div class="modal-header">
        <h3>System Telemetry</h3>
        <button class="btn-icon" onclick="closeModal('modal-stats')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="stats-content">Loading telemetry...</div>
      <div style="display: flex; justify-content: flex-end; margin-top: 1.25rem;">
        <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-stats')">Close</button>
      </div>
    </div>
  </div>

  <!-- API Live Inspector Drawer -->
  <footer class="debug-drawer">
    <div class="debug-header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80;"></span>
        <b>Live API Inspector</b>
      </div>
      <span style="opacity: 0.6;">PHP 8.5 &bull; MySQL 8.0</span>
    </div>
    <div class="debug-body" id="api-log-list">
      <div class="log-entry" style="color: var(--text-dim);">Awaiting HTTP API calls...</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
